<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Finanzas Pro</title>
<style>
:root{--bg:#0a1226;--card:#121c38;--card2:#192448;--gold:#d4af37;--txt:#f5f6fa;--mut:#8f9bb8;--ok:#3ecf8e;--warn:#f5a524;--bad:#ff5c6c;--line:#26335c}
body.light{--bg:#f4f5f9;--card:#fff;--card2:#eef0f7;--txt:#111a33;--mut:#5d6785;--line:#d9ddeb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:78px}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.logo{width:96px;height:96px;border:3px solid var(--gold);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--gold);animation:pop 1s ease both,glow 2s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{box-shadow:0 0 6px #d4af3733}to{box-shadow:0 0 28px #d4af3777}}
#splash h1{color:var(--gold);letter-spacing:4px;margin:18px 0 4px}
#splash p{color:var(--mut);margin:0 0 22px}
.bar{width:160px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);animation:load 1.6s ease forwards}
@keyframes load{to{width:100%}}
header{padding:16px 16px 4px;display:flex;align-items:center;justify-content:space-between}
header h2{margin:0;font-size:20px;color:var(--gold)}
main{padding:8px 14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:20px}
.gold{color:var(--gold)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 2px;font-size:11px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--gold)}
button.pri{background:var(--gold);color:#111;border:0;border-radius:12px;padding:11px 16px;font-weight:700}
button.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.sm{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.prog{height:10px;background:var(--card2);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button{flex:0 0 auto}.tabs .on{background:var(--gold);color:#111}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{min-height:46px;background:var(--card2);border-radius:8px;padding:3px;font-size:11px}
.cal .h{background:none;min-height:0;color:var(--mut)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.fab{position:fixed;right:16px;bottom:90px;width:54px;height:54px;border-radius:50%;font-size:28px;z-index:10;box-shadow:0 4px 16px #0006}
.mut{color:var(--mut)}
@media print{nav,.fab,header button,#splash{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff}}
</style>
</head>
<body>
<div id="splash"><div class="logo">FP</div><h1>FINANZAS PRO</h1><p>Controla tus gastos, organiza tu futuro</p><div class="bar"><i></i></div></div>
<header><h2 id="title">Inicio</h2><button class="sec sm" onclick="go('ajustes')">⚙</button></header>
<main id="view"></main>
<button class="pri fab" onclick="openForm()">+</button>
<nav id="nav"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
</body>
</html>
